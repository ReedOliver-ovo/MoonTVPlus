name: Build server-cache image

on:
  push:
    branches:
      - feature/server-cache

permissions:
  contents: read
  packages: write

concurrency:
  group: server-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ReedOliver-ovo/MoonTVPlus' && github.ref == 'refs/heads/feature/server-cache'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the approved Fork branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the amd64 server-cache image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/reedoliver-ovo/moontvplus:server-cache-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ReedOliver-ovo/MoonTVPlus
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=MoonTVPlus
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export the published image for VPS deployment
        env:
          IMAGE: ghcr.io/reedoliver-ovo/moontvplus:server-cache-${{ github.sha }}
        run: |
          set -o pipefail
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{join .RepoDigests "\n"}}'
          docker save "$IMAGE" | gzip -1 > /tmp/moontvplus-server-cache.tar.gz

      - name: Upload the short-lived deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-cache-amd64
          path: /tmp/moontvplus-server-cache.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
